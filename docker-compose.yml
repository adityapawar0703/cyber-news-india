version: '3.8'

services:
  # Cyber India News Full-Stack Web & API Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyber-india-news-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/cyber_india_news
      - JWT_SECRET=cin_prod_secret_replace_with_random_64_characters
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:5000,http://localhost:5173
      - ADMIN_USERNAME=admin
      - ADMIN_EMAIL=editor@cyberindianews.in
      - ADMIN_PASSWORD=CyberIndia#2026
    depends_on:
      - mongodb
    volumes:
      - uploads_data:/app/server/uploads

  # Local MongoDB Container
  mongodb:
    image: mongo:7-jammy
    container_name: cyber-india-news-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
  uploads_data:
